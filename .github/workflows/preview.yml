# Preview deployment workflow; production main branch remains untouched.
name: Deploy Preview

on:
  push:
    branches:
      - preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare preview site
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='CNAME' \
            --exclude='.DS_Store' \
            --exclude='README.md' \
            ./ _site/

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
